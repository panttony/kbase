services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: kbase
      POSTGRES_PASSWORD: kbase
      POSTGRES_DB: kbase
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kbase -d kbase"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      HTTP_ADDR: ":8080"
      PG_DSN: "postgres://kbase:kbase@postgres:5432/kbase?sslmode=disable"
      REDIS_ADDR: "redis:6379"
      INDEX_PATH: "/data/index"
      CACHE_TTL: "60s"
    ports:
      - "8080:8080"
    volumes:
      - indexdata:/data

volumes:
  pgdata:
  indexdata: